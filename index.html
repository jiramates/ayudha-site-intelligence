<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ayudha Site Intelligence</title>
<!--og-meta-->
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="gdefs"></defs>
  <path id="islandSrc" d="M 160 340 C 170 220, 320 160, 520 165 C 700 168, 850 210, 860 340 C 870 470, 820 600, 640 640 C 480 670, 280 650, 200 560 C 150 500, 150 420, 160 340 Z"/>
  <path id="rvW" d="M 40 0 C 90 120, 150 240, 160 340"/>
  <path id="rvN" d="M 470 0 C 480 70, 500 120, 520 165"/>
  <path id="rvE" d="M 990 60 C 920 130, 870 200, 830 240"/>
  <path id="rvS" d="M 650 640 C 640 690, 620 730, 600 760"/>
</svg>

<div class="wrap">
  <header class="frame">
    <svg id="heroSvg" viewBox="0 0 1000 380" role="img" data-aria="hero.aria"></svg>
    <div class="hero-t">
      <div class="eyebrow" data-t="hero.eyebrow"></div>
      <h1 id="heroTitle"></h1>
      <p id="heroLead"></p>
      <span class="scrollhint"><span data-t="hero.scroll"></span> <i>▾</i></span>
    </div>
  </header>

  <div class="band" aria-hidden="true"></div>

  <section aria-labelledby="c1">
    <div class="chap"><span class="no" data-chapter="1"></span><h2 id="c1" data-t="ch1.title"></h2><p data-t="ch1.sub"></p></div>
    <div class="frame"><svg id="scene" viewBox="0 0 900 480" role="img" data-aria="ch1.aria"></svg></div>
    <div class="duo" id="lines"></div>
  </section>

  <div class="band" aria-hidden="true"></div>

  <section aria-labelledby="c2" id="mapsec">
    <div class="chap"><span class="no" data-chapter="2"></span><h2 id="c2" data-t="ch2.title"></h2><p data-t="ch2.sub"></p></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-mode="site" aria-selected="true"><span class="k" data-num="1"></span><span><b data-t="tabs.site.name"></b><small data-t="tabs.site.sub"></small></span></button>
      <button class="tab" role="tab" id="t-reg" data-mode="reg" aria-selected="false"><span class="k" data-num="2"></span><span><b data-t="tabs.reg.name"></b><small data-t="tabs.reg.sub"></small></span></button>
      <button class="tab" role="tab" id="t-tr" data-mode="tr" aria-selected="false"><span class="k" data-num="3"></span><span><b data-t="tabs.tr.name"></b><small data-t="tabs.tr.sub"></small></span></button>
    </div>
    <div class="frame mapframe" id="mapbox">
      <svg id="map" viewBox="0 0 1000 700" role="img"></svg>
      <div class="loading" id="loading" data-t="map.loading"></div>
      <div class="maphint" id="hint"></div>
      <button class="mapbtn" id="zoomOut" data-t="map.zoomOut" hidden></button>
      <button class="mapbtn save" id="saveMap" type="button" data-t="map.save"></button>
      <span class="sr-only" id="mapStatus" role="status" aria-live="polite"></span>
      <div class="leaf cap" id="cap" hidden></div>
    </div>
    <div class="pgrid">
      <div class="leaf narr wide"><div class="pt" id="nPt"></div><div><div class="who" id="nWho"></div><div class="say" id="say"></div></div></div>
      <div id="panel" style="display:contents"></div>
    </div>
  </section>

  <div class="band" aria-hidden="true"></div>

  <section aria-labelledby="c3">
    <div class="chap"><span class="no" data-chapter="3"></span><h2 id="c3" data-t="ch3.title"></h2><p data-t="ch3.sub"></p></div>
    <div class="ending">
      <div class="leaf rv"><h3 id="cmpTitle"></h3><p class="dim" data-t="cmp.hint"></p><div class="scroll"><table class="tbl cmp" id="cmp"></table></div></div>
      <div class="duo" id="opin" style="margin-top:0"></div>
      <div class="leaf rv"><h3 data-t="end.resolution"></h3>
        <div id="resolution"></div>
        <h4 data-t="end.full"></h4>
        <ul class="soon" id="comingSoon"></ul>
      </div>
      <div class="leaf rv colophon"><div class="seal" data-t="end.seal"></div>
        <p id="colophon"></p>
      </div>
    </div>
    <p class="note" data-t="end.note"></p>
  </section>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
